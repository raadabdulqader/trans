services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nakah-customs-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:nakah_db_secret_pass@postgres:5432/nakah?schema=public
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: nakah-customs-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=nakah_db_secret_pass
      - POSTGRES_DB=nakah
    volumes:
      - nakah_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nakah"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nakah_pgdata:
    driver: local
